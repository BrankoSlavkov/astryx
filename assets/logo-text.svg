<svg width="420" height="160" viewBox="0 0 420 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="astrxyGradient" x1="0" y1="0" x2="200" y2="160">
      <stop offset="0%" stop-color="#03b3ca"/>
      <stop offset="100%" stop-color="#4dabf7"/>
    </linearGradient>
  </defs>

  <!-- Icon -->
  <g transform="translate(20,20)">
    <!-- A shape -->
    <line x1="30" y1="100" x2="70" y2="10" stroke="url(#astrxyGradient)" stroke-width="2"/>
    <line x1="70" y1="10" x2="110" y2="100" stroke="url(#astrxyGradient)" stroke-width="2"/>
    <line x1="45" y1="70" x2="95" y2="70" stroke="url(#astrxyGradient)" stroke-width="2"/>

    <!-- Nodes -->
    <circle cx="30" cy="100" r="3" fill="#4dabf7"/>
    <circle cx="70" cy="10" r="3" fill="#4dabf7"/>
    <circle cx="110" cy="100" r="3" fill="#4dabf7"/>
    <circle cx="70" cy="70" r="2.5" fill="#03b3ca"/>
  </g>

  <!-- Wordmark -->
  <text x="160" y="95"
        font-family="Orbitron, Arial, sans-serif"
        font-size="42"
        letter-spacing="6"
        fill="#e6edf3">
    ASTRYX
