<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="astrxyGradient" x1="0" y1="0" x2="200" y2="200">
      <stop offset="0%" stop-color="#03b3ca"/>
      <stop offset="100%" stop-color="#4dabf7"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" fill="#0b0f14"/>

  <!-- Stylized A (constellation style) -->
  <line x1="50" y1="150" x2="100" y2="40" stroke="url(#astrxyGradient)" stroke-width="2"/>
  <line x1="100" y1="40" x2="150" y2="150" stroke="url(#astrxyGradient)" stroke-width="2"/>
  <line x1="70" y1="110" x2="130" y2="110" stroke="url(#astrxyGradient)" stroke-width="2"/>

  <!-- Star nodes -->
  <circle cx="50" cy="150" r="3" fill="#4dabf7"/>
  <circle cx="100" cy="40" r="3" fill="#4dabf7"/>
  <circle cx="150" cy="150" r="3" fill="#4dabf7"/>
  <circle cx="100" cy="110" r="2.5" fill="#03b3ca"/>

  <!-- Glow effect -->
  <circle cx="100" cy="40" r="8" fill="#03b3ca" opacity="0.15"/>
</svg>